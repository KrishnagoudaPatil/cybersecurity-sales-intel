version: 2
models:
  - name: dim_company
    description: "One row per resolved company (by primary domain) with footprint aggregates."
    columns:
      - name: company_domain
        description: "Primary registrable domain — the company key."
        tests: [not_null, unique]
  - name: fct_account_score
    description: "Scored prospects: security risk (need) + market fit -> total score + tier."
    columns:
      - name: company_domain
        tests: [not_null, unique]
      - name: tier
        tests:
          - accepted_values:
              arguments:
                values: ['A','B','C','D']
