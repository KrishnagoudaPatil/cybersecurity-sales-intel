name: firmable
version: "1.0.0"
config-version: 2
profile: firmable

model-paths: ["models"]
seed-paths: ["seeds"]

models:
  firmable:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  firmable:
    +schema: seeds
